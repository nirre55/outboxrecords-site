<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>You're in · The Unsent</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="../favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #111114; --ink-2: #1a1a1f; --line: #2a2a31; --paper: #f2efe8; --muted: #9b98a3; --amber: #ffb454; --violet: #8a4fff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--ink); color: var(--paper); font-family: "Space Grotesk", system-ui, sans-serif; line-height: 1.55; min-height: 100vh; display: grid; place-items: center; padding: 40px 16px; -webkit-font-smoothing: antialiased; }
    .card { max-width: 460px; width: 100%; background: var(--ink-2); border: 1px solid var(--line); border-radius: 18px; padding: 32px 24px; text-align: center; }
    .card img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 2px solid var(--violet); }
    .mono { display: block; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-top: 20px; }
    h1 { font-size: 2rem; letter-spacing: -.02em; margin: 8px 0 12px; }
    h1 span { color: var(--violet); }
    p { color: var(--muted); margin-bottom: 20px; }
    .links { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .links a { text-decoration: none; border: 1px solid var(--violet); color: var(--paper); border-radius: 999px; padding: 8px 14px; font-size: .88rem; }
    .links a.main { background: var(--amber); border-color: var(--amber); color: var(--ink); font-weight: 700; }
    small { display: block; margin-top: 24px; color: var(--muted); font-size: .78rem; }
    small a { color: var(--paper); }
  </style>
</head>
<body>
  <main class="card">
    <img src="../assets/ivy-static.jpg" alt="Ivy Static, a virtual singer">
    <span class="mono">The unsent · 103.7 FM</span>
    <h1>you're <span>in.</span></h1>
    <p>i just sent you a welcome message. from now on, every new song reaches you first.</p>
    <div class="links">
      <a class="main" href="https://distrokid.com/hyperfollow/ivystatic/307-am">Pre-save 3:07 AM ↗</a>
      <a href="https://www.tiktok.com/@ivystatic.music">TikTok ↗</a>
      <a href="https://www.instagram.com/ivystatic.music/">Instagram ↗</a>
      <a href="https://www.youtube.com/@ivystaticmusic">YouTube ↗</a>
    </div>
    <small>Ivy Static is a virtual, AI-made artist by <a href="../">Outbox Records</a>.</small>
  </main>
</body>
</html>
